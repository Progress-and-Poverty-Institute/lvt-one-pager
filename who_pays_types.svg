<text x="0" y="79.0" font-size="13" font-weight="700" fill="#111111">Shops, offices, industry</text>
<rect x="160" y="64" width="129.7" height="21" fill="#1A8E86"/>
<rect x="289.7" y="64" width="190.3" height="21" fill="#D8432F"/>
